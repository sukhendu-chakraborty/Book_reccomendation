<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Recommender System</title>

    <!-- Bootstrap 3 -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        body {
            background: #ffffff;
            font-family: 'Inter', sans-serif;
            padding-top: 120px;
        }

        /* ================= NAVBAR ================= */
        .glass-navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 65%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 10px 30px;
            z-index: 1000;
        }

        .glass-navbar .navbar-brand {
            font-weight: 700;
            color: #1f9d55;
            font-size: 20px;
        }

        .glass-navbar ul li a {
            color: #333 !important;
            font-weight: 500;
        }

        .glass-navbar ul li a:hover {
            color: #facc15 !important;
        }

        /* ================= CENTER ALIGN ================= */
        .center-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page-title {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 25px;
            color: #111;
            text-align: center;
        }

        /* ================= SEARCH ================= */
        .search-wrapper {
            width: 65%;
            margin-bottom: 40px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            height: 50px;
            font-size: 16px;
        }

        .search-box .btn {
            background: #facc15;
            border: none;
            font-weight: 600;
            padding: 0 30px;
        }

        .search-box .btn:hover {
            background: #eab308;
        }

        /* ===== DATALIST COLORS ===== */
        input[list]::-webkit-calendar-picker-indicator {
            display: none;
        }

        datalist option {
            background: #ffffff;
            color: #000000;
            font-size: 15px;
        }

        /* ================= BOOK GRID ================= */
        .book-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            height: 100%;
        }

        .book-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        }

        /* ✅ 9:16 BOOK COVER FIX */
        .book-card img {
            width: 100%;
            aspect-ratio: 9 / 16;
            object-fit: contain;
            background: #f8f8f8;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .book-title {
            font-size: 14px;
            font-weight: 600;
            color: #111;
            margin-bottom: 4px;
        }

        .book-author {
            font-size: 13px;
            color: #1f9d55;
            font-weight: 500;
        }

        .book-grid {
            margin-bottom: 60px;
        }
    </style>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar glass-navbar">
    <div class="container-fluid">
        <div class="navbar-header">
            <a class="navbar-brand">LibriX!</a>
        </div>
        <ul class="nav navbar-nav navbar-right">
            <li><a href="/">Home</a></li>
            <li><a href="/recommend">Recommend</a></li>
        </ul>
    </div>
</nav>

<!-- ================= MAIN ================= -->
<div class="container">

    <div class="center-wrapper">

        <h1 class="page-title">Recommend Books</h1>

        <!-- SEARCH (DROPDOWN ALWAYS PRESENT) -->
        <div class="search-wrapper">
            <form action="/recommend_books" method="post" class="search-box">
                <input
                    name="user_input"
                    type="text"
                    class="form-control"
                    list="book-list"
                    placeholder="Search for a book..."
                    required
                >

                <!-- 🔥 ALWAYS RENDERED -->
                <datalist id="book-list">
                    {% for book in book_names %}
                        <option value="{{ book }}">
                    {% endfor %}
                </datalist>

                <input type="submit" class="btn btn-warning btn-lg" value="Search">
            </form>
        </div>

    </div>

    <!-- RESULTS -->
    <div class="row book-grid">
        {% if data %}
            {% for i in data %}
                <div class="col-md-3 col-sm-6" style="margin-bottom:30px">
                    <div class="book-card">
                        <img src="{{ i[2] }}" alt="Book Cover">
                        <p class="book-title">{{ i[0] }}</p>
                        <p class="book-author">{{ i[1] }}</p>
                    </div>
                </div>
            {% endfor %}
        {% endif %}
    </div>

</div>

</body>
</html>
