<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Recommender System</title>

    <!-- Bootstrap 3 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: #ffffff;
            font-family: 'Inter', sans-serif;
            padding-top: 100px;
        }

        /* ================= NAVBAR ================= */
        .glass-navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1100px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 10px 30px;
            z-index: 1000;
        }

        .glass-navbar .navbar-brand {
            font-weight: 700;
            color: #1f9d55;
            font-size: 20px;
        }

        .glass-navbar ul li a {
            color: #333 !important;
            font-weight: 500;
        }

        .glass-navbar ul li a:hover {
            color: #facc15 !important;
        }

        /* ================= HEADER ================= */
        .page-title {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 40px;
            color: #111;
        }

        /* ================= BOOK GRID ================= */
        .book-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            height: 100%;
        }

        .book-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 32px rgba(0,0,0,0.12);
        }

        .book-card img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .book-title {
            font-size: 15px;
            font-weight: 600;
            color: #111;
            margin-bottom: 4px;
        }

        .book-author {
            font-size: 13px;
            color: #1f9d55;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .book-meta {
            font-size: 13px;
            color: #555;
            margin-bottom: 4px;
        }

        .rating {
            color: #facc15;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <!-- Glass Navbar -->
    <nav class="navbar glass-navbar">
        <div class="container-fluid">
            <div class="navbar-header">
                <a class="navbar-brand">LibriX!</a>
            </div>
            <ul class="nav navbar-nav navbar-right">
                <li><a href="/">Home</a></li>
                <li><a href="/recommend">Recommend</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <h1 class="page-title">Top 48 Books</h1>

        <div class="row">

            {% for i in range(book_name|length) %}
            <div class="col-md-3 col-sm-6" style="margin-bottom:30px">
                <div class="book-card">
                    <img src="{{ image[i] }}" alt="Book Cover">

                    <p class="book-title">{{ book_name[i] }}</p>
                    <p class="book-author">{{ author[i] }}</p>

                    <p class="book-meta">Votes: {{ votes[i] }}</p>
                    <p class="book-meta">
                        Rating: <span class="rating">{{ rating[i] }}</span>
                    </p>
                </div>
            </div>
            {% endfor %}

        </div>
    </div>

</body>
</html>
#end of code
